r)</text><text x="580.0" y="195.0" class="s">fixed · wind_aware · linear_wind · RL</text><text x="580.0" y="210.0" class="m">policies.py</text><rect x="90" y="250" width="420" height="62" rx="4" class="bx"/><text x="100.0" y="270.0" class="t">CONTROLLER LAYER</text><text x="100.0" y="285.0" class="s">L1 guidance · TECS · attitude PIDs · runway steering</text><text x="100.0" y="300.0" class="m">control.py</text><rect x="90" y="340" width="420" height="62" rx="4" class="bx"/><text x="100.0" y="360.0" class="t">CONTROL SURFACES</text><text x="100.0" y="375.0" class="s">servo lag · rate limit · deadband · servo power</text><text x="100.0" y="390.0" class="m">actuators.py</text><rect x="90" y="430" width="420" height="62" rx="4" class="bx"/><text x="100.0" y="450.0" class="t">FLIGHT DYNAMICS (JSBSim 6-DoF, 200 Hz)</text><text x="100.0" y="465.0" class="s">aerodynamics · gear · rotor ODE · thrust</text><text x="100.0" y="480.0" class="m">fdm.py · models.py</text><rect x="570" y="430" width="270" height="62" rx="4" class="bx"/><text x="580.0" y="450.0" class="t">ELECTRIC POWERTRAIN</text><text x="580.0" y="465.0" class="s">battery 1-RC → ESC → motor (Drela)</text><text x="580.0" y="480.0" class="m">energy/</text><rect x="90" y="530" width="750" height="62" rx="4" class="bx"/><text x="100.0" y="550.0" class="t">ENERGY LEDGER &amp; LOGGING</text><text x="100.0" y="565.0" class="s">air-relative energy balance · electrical meters → timeseries · events · legs · phases · summary · metadata</text><text x="100.0" y="580.0" class="m">simulation.py · logger.py · metrics.py</text><rect x="90" y="640" width="240" height="62" rx="4" class="bx"/><text x="210.0" y="667.5" class="t" text-anchor="middle">PARAMETER STUDIES · OPTIMISER</text><text x="210.0" y="682.5" class="m" text-anchor="middle">batch.py · optimize.py</text><rect x="345" y="640" width="240" height="62" rx="4" class="bx"/><text x="465.0" y="667.5" class="t" text-anchor="middle">REINFORCEMENT LEARNING</text><text x="465.0" y l(#a-pipeline)"/><text x="713.0" y="517.0" class="l">electrical powers</text><polyline points="210.0,592.0 210.0,640.0" class="ln" fill="none" marker-end="url(#a-pipeline)"/><polyline points="465.0,592.0 465.0,640.0" class="ln" fill="none" marker-end="url(#a-pipeline)"/><polyline points="720.0,592.0 720.0,640.0" class="ln" fill="none" marker-end="url(#a-pipeline)"/><text x="218.0" y="624.0" class="l">log files</text><polyline points="90.0,101.0 34.0,101.0 34.0,476.0 90.0,476.0" class="ln" fill="none" marker-end="url(#a-pipeline)"/><text x="28.0" y="290.0" class="l" text-anchor="middle" transform="rotate(-90 28.0 290.0)">wind W(t,h), NED → JSBSim</text><polyline points="90.0,446.0 58.0,446.0 58.0,191.0 90.0,191.0" class="ln" fill="none" marker-end="url(#a-pipeline)"/><text x="52.0" y="325.0" class="l" text-anchor="middle" transform="rotate(-90 52.0 325.0)">true state → sensors</text></svg></div><figcaption>The simulation pipeline. Each layer is one module and one configuration section. Rotor speed and motor torque couple JSBSim and the powertrain every physics step. The <b>policy slot</b> (highlighted) is where an adaptive energy-optimising controller plugs in.</figcaption></figure>
