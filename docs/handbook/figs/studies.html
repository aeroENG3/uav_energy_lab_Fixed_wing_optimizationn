<figure class="fig" id="fig-studies"><div class="fig-scroll"><svg viewBox="0 0 860 262" role="img" aria-label="Parameter studies expand a specification into jobs run by a spawn process pool into datasets; the cross-entropy optimiser loops sample, evaluate with common random numbers, score and update, reusing the same runner." xmlns="http://www.w3.org/2000/svg"><defs><marker id="a-studies" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="aa-studies" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="aha"/></marker></defs><text x="15.0" y="20.0" class="k">PARAMETER STUDY  ·  batch.py</text><rect x="15" y="30" width="190" height="60" rx="4" class="bx"/><text x="110.0" y="56.5" class="t" text-anchor="middle">Specification</text><text x="110.0" y="71.5" class="s" text-anchor="middle">YAML file or interface form</text><rect x="227" y="30" width="190" height="60" rx="4" class="bx"/><text x="322.0" y="56.5" class="t" text-anchor="middle">build_jobs</text><text x="322.0" y="71.5" class="s" text-anchor="middle">grid × LHS × replicates</text><rect x="439" y="30" width="190" height="60" rx="4" class="bxa"/><text x="534.0" y="56.5" class="t" text-anchor="middle">spawn process pool</text><text x="534.0" y="71.5" class="s" text-anchor="middle">run_one(job) × workers</text><rect x="651" y="30" width="190" height="60" rx="4" class="bx"/><text x="746.0" y="49.0" class="t" text-anchor="middle">Datasets</text><text x="746.0" y="64.0" class="s" text-anchor="middle">per run and per leg (CSV)</text><text x="746.0" y="79.0" class="m" text-anchor="middle">runs/&lt;id&gt;/ full logs</text><polyline points="205.0,60.0 227.0,60.0" class="ln" fill="none" marker-end="url(#a-studies)"/><polyline points="417.0,60.0 439.0,60.0" class="ln" fill="none" marker-end="url(#a-studies)"/><polyline points="629.0,60.0 651.0,60.0" class="ln" fill="none" marker-end="url(#a-studies)"/><text x="15.0" y="138.0" class="k">OPTIMISATION (cross-entropy method)  ·  optimize.py</text><rect x="15" y="150" width="190" height="60" rx="4" class="bx"/><text x="110.0" y="176.5" class="t" text-anchor="middle">Update μ, σ</text><text x="110.0" y="191.5" class="s" text-anchor="middle">smooth towards the elites</text><rect x="227" y="150" width="190" height="60" rx="4" class="bx"/><text x="322.0" y="176.5" class="t" text-anchor="middle">Sample population</text><text x="322.0" y="191.5" class="s" text-anchor="middle">N(μ, σ²) within bounds</text><rect x="439" y="150" width="190" height="60" rx="4" class="bx"/><text x="534.0" y="176.5" class="t" text-anchor="middle">Evaluate</text><text x="534.0" y="191.5" class="s" text-anchor="middle">conditions × seeds (CRN)</text><rect x="651" y="150" width="190" height="60" rx="4" class="bx"/><text x="746.0" y="176.5" class="t" text-anchor="middle">Score</text><text x="746.0" y="191.5" class="s" text-anchor="middle">mean objective + 10⁶ × violations</text><polyline points="205.0,180.0 227.0,180.0" class="ln" fill="none" marker-end="url(#a-studies)"/><polyline points="417.0,180.0 439.0,180.0" class="ln" fill="none" marker-end="url(#a-studies)"/><polyline points="629.0,180.0 651.0,180.0" class="ln" fill="none" marker-end="url(#a-studies)"/><polyline points="746.0,210.0 746.0,228.0 110.0,228.0 110.0,210.0" class="ln" fill="none" marker-end="url(#a-studies)"/><text x="428.0" y="244.0" class="l" text-anchor="middle">next generation · finally: best design flown again with full logs (best_run/)</text><polyline points="504.0,150.0 504.0,90.0" class="ln" fill="none" marker-end="url(#a-studies)"/><text x="498.0" y="122.0" class="l" text-anchor="end">jobs</text><polyline points="564.0,90.0 564.0,150.0" class="ln" fill="none" marker-end="url(#a-studies)"/><text x="570.0" y="122.0" class="l">summaries</text></svg></div><figcaption>The study engine. A parameter study expands
