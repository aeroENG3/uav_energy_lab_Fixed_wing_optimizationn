<figure class="fig" id="fig-modes"><div class="fig-scroll"><svg viewBox="0 0 860 340" role="img" aria-label="Flight-mode state machine from pre-flight through take-off, climb-out, mission, approach, flare and roll-out to landed, with go-around and no-go branches and the decisions that trigger them." xmlns="http://www.w3.org/2000/svg"><defs><marker id="a-modes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="aa-modes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="aha"/></marker></defs><rect x="20" y="44" width="110" height="44" rx="4" class="bx"/><text x="75.0" y="62.5" class="t" text-anchor="middle">PREFLIGHT</text><text x="75.0" y="77.5" class="s" text-anchor="middle">settle 2 s</text><rect x="185" y="44" width="110" height="44" rx="4" class="bx"/><text x="240.0" y="62.5" class="t" text-anchor="middle">TAKEOFF_ROLL</text><text x="240.0" y="77.5" class="s" text-anchor="middle">steer, tail up</text><rect x="350" y="44" width="110" height="44" rx="4" class="bx"/><text x="405.0" y="62.5" class="t" text-anchor="middle">ROTATE</text><text x="405.0" y="77.5" class="s" text-anchor="middle">to 9° pitch</text><rect x="515" y="44" width="110" height="44" rx="4" class="bx"/><text x="570.0" y="62.5" class="t" text-anchor="middle">CLIMB_OUT</text><text x="570.0" y="77.5" class="s" text-anchor="middle">full power, 14 m/s</text><rect x="690" y="44" width="110" height="44" rx="4" class="bx"/><text x="745.0" y="62.5" class="t" text-anchor="middle">MISSION</text><text x="745.0" y="77.5" class="s" text-anchor="middle">legs · policy</text><polyline points="130.0,66.0 185.0,66.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="157.5" y="36.0" class="l" text-anchor="middle">armed</text><polyline points="295.0,66.0 350.0,66.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="322.5" y="36.0" class="l" text-anchor="middle">V ≥ 13 m/s</text><polyline points="460.0,66.0 515.0,66.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="487.5" y="36.0" class="l" text-anchor="middle">h &gt; 3 m</text><polyline points="625.0,66.0 690.0,66.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="657.5" y="36.0" class="l" text-anchor="middle">h ≥ 25 m</text><rect x="20" y="180" width="110" height="44" rx="4" class="bxbad"/><text x="75.0" y="198.5" class="t" text-anchor="middle">NO_GO</text><text x="75.0" y="213.5" class="s" text-anchor="middle">terminal</text><rect x="185" y="180" width="110" height="44" rx="4" class="bxok"/><text x="240.0" y="198.5" class="t" text-anchor="middle">LANDED</text><text x="240.0" y="213.5" class="s" text-anchor="middle">GS &lt; 0.5 m/s</text><rect x="350" y="180" width="110" height="44" rx="4" class="bx"/><text x="405.0" y="198.5" class="t" text-anchor="middle">ROLLOUT</text><text x="405.0" y="213.5" class="s" text-anchor="middle">wheel landing</text><rect x="515" y="180" width="110" height="44" rx="4" class="bx"/><text x="570.0" y="198.5" class="t" text-anchor="middle">FLARE</text><text x="570.0" y="213.5" class="s" text-anchor="middle">exponential, h &lt; 3 m</text><rect x="690" y="180" width="150" height="44" rx="4" class="bx"/><text x="765.0" y="198.5" class="t" text-anchor="middle">APPROACH</text><text x="765.0" y="213.5" class="s" text-anchor="middle">to_align → align → final</text><rect x="690" y="276" width="150" height="44" rx="4" class="bx"/><text x="765.0" y="294.5" class="t" text-anchor="middle">GO_AROUND</text><text x="765.0" y="309.5" class="s" text-anchor="middle">climb to pattern + 15 m</text><polyline points="745.0,88.0 745.0,180.0" class="ln acc" fill="none" marker-end="url(#aa-modes)"/><text x="753.0" y="118.0" class="la">complete ·</text><text x="753.0" y="132.0" class="la">D4 D5 D6 D8</text><polyline points="690.0,202.0 625.0,202.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="657.5" y="172.0" class="l" text-anchor="middle">flare height</text><polyline points="515.0,194.0 460.0,194.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="487.5" y="172.0" class="l" text-anchor="middle">touchdown</text><polyline points="460.0,212.0 515.0,212.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="487.5" y="240.0" class="l" text-anchor="middle">re-flare</text><polyline points="350.0,202.0 295.0,202.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="322.5" y="172.0" class="l" text-anchor="middle">stopped</text><polyline points="740.0,224.0 740.0,276.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="734.0" y="256.0" class="l" text-anchor="end">D7</text><polyline points="790.0,276.0 790.0,224.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="796.0" y="256.0" class="l">climbed</text><polyline points="405.0,224.0 405.0,306.0 690.0,306.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="547.5" y="300.0" class="l" text-anchor="middle">bounce &gt; 2 m (D7)</text><polyline points="60.0,88.0 60.0,180.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="66.0" y="128.0" class="l">D2 no-go</text><polyline points="240.0,88.0 240.0,146.0 105.0,146.0 105.0,180.0" class="ln" fill="none" marker-end="url(#a-modes)"/><text x="246.0" y="128.0" class="l">abort (D2)</text><text x="20.0" y="300.0" class="s">Any mode → CRASHED (structure contact)</text><text x="20.0" y="318.0" class="s">Any mode → TIMEOUT (t_max)</text></svg></div><figcaption>Flight modes and the transitions between them. Energy and safety decisions (D4, D5, D6, D8) end the mission early by switching to APPROACH. Go-around (D7) loops back to the approach. Terminal states are LANDED, NO_GO, CRASHED and TIMEOUT.</figcaption></figure>
