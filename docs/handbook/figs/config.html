<figure class="fig" id="fig-config"><div class="fig-scroll"><svg viewBox="0 0 860 160" role="img" aria-label="Configuration resolution: defaults, then scenario files, then overrides, then validation, giving the resolved configuration and its hash." xmlns="http://www.w3.org/2000/svg"><defs><marker id="a-config" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="aa-config" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="aha"/></marker></defs><rect x="12" y="20" width="148" height="60" rx="4" class="bx"/><text x="86.0" y="46.5" class="t" text-anchor="middle">defaults.yaml</text><text x="86.0" y="61.5" class="s" text-anchor="middle">every key, unit, tag</text><polyline points="160.0,50.0 185.0,50.0" class="ln" fill="none" marker-end="url(#a-config)"/><rect x="185" y="20" width="148" height="60" rx="4" class="bx"/><text x="259.0" y="46.5" class="t" text-anchor="middle">scenario files</text><text x="259.0" y="61.5" class="s" text-anchor="middle">deep-merge, in order</text><polyline points="333.0,50.0 358.0,50.0" class="ln" fill="none" marker-end="url(#a-config)"/><rect x="358" y="20" width="148" height="60" rx="4" class="bx"/><text x="432.0" y="46.5" class="t" text-anchor="middle">overrides</text><text x="432.0" y="61.5" class="s" text-anchor="middle">--set · UI edits · factors</text><polyline points="506.0,50.0 531.0,50.0" class="ln" fill="none" marker-end="url(#a-config)"/><rect x="531" y="20" width="148" height="60" rx="4" class="bx"/><text x="605.0" y="46.5" class="t" text-anchor="middle">validate()</text><text x="605.0" y="61.5" class="s" text-anchor="middle">all problems at once</text><polyline points="679.0,50.0 704.0,50.0" class="ln" fill="none" marker-end="url(#a-config)"/><rect x="704" y="20" width="148" height="60" rx="4" class="bxa"/><text x="778.0" y="46.5" class="t" text-anchor="middle">resolved config</text><text x="778.0" y="61.5" class="s" text-anchor="middle">+ hash → metadata.json</text><rect x="165" y="112" width="301" height="34" rx="4" class="bx2" stroke-dasharray="4 3"/><text x="177.0" y="133.0" class="s">interface / optimiser: config_from_dict(base, overrides)</text><polyline points="432.0,112.0 432.0,80.0" class="ln" fill="none" marker-end="url(#a-config)"/></svg></div><figcaption>How a configuration is resolved. The interface and the optimiser enter with an in-memory dictionary (<code>config_from_dict</code>) and go through the same validation. A typo in a key is an error, never ignored.</figcaption></figure>
