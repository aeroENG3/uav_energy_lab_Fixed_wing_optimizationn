<figure class="fig" id="fig-l1"><div class="fig-scroll"><svg viewBox="0 0 860 250" role="img" aria-label="L1 guidance geometry: the aircraft is off the path by the cross-track error; a reference point on the path lies L1 ahead; the angle eta between the ground velocity and the line to the reference point sets the lateral acceleration that follows a circular arc to that point." xmlns="http://www.w3.org/2000/svg"><defs><marker id="a-l1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="aa-l1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="aha"/></marker></defs><line x1="40.0" y1="190.0" x2="560.0" y2="190.0" class="ln thick"/><circle cx="70" cy="190" r="4" class="dot"/><text x="70.0" y="210.0" class="t" text-anchor="middle">A</text><circle cx="540" cy="190" r="4" class="dot"/><text x="540.0" y="210.0" class="t" text-anchor="middle">B</text><text x="300.0" y="226.0" class="s" text-anchor="middle">desired path A → B</text><circle cx="240.0" cy="110.0" r="5" class="dot"/><text x="230.0" y="100.0" class="l" text-anchor="end">aircraft</text><polyline points="240.0,110.0 347.6,87.1" class="ln" fill="none" marker-end="url(#a-l1)"/><text x="351.6" y="81.1" class="l">V_g</text><line x1="240.0" y1="110.0" x2="366.9" y2="190.0" class="ln" stroke-dasharray="3 3"/><text x="313.4" y="144.0" class="l">L₁</text><circle cx="366.9" cy="190" r="4.5" class="dota"/><text x="374.9" y="182.0" class="la">R (reference point)</text><line x1="240.0" y1="110.0" x2="240.0" y2="190.0" class="ln thin" stroke-dasharray="3 3"/><text x="234.0" y="154.0" class="l" text-anchor="end">y (cross-track)</text><path d="M 283.0 100.9 A 44 44 0 0 1 277.2 133.5" class="ln thin" fill="none"/><text x="295.1" y="123.8" class="t" text-anchor="middle">η</text><path d="M 240.0 110.0 A 107.5 107.5 0 0 1 366.9 190.0" class="ln acc" fill="none" stroke-dasharray="2 3"/><polyline points="240.0,110.0 249.6,155.0" class="ln acc" fill="none" marker-end="url(#aa-l1)"/><text x="255.6" y="157.0" class="la">a_cmd</text><text x="610.0" y="60.0" class="s">a_cmd = K_L1 · V_g² / L₁ · sin η</text><text x="610.0" y="84.0" class="s">η = η₁ + η₂,  η₁ = asin(y / L₁)</text><text x="610.0" y="108.0" class="s">L₁ = ζ · T · V_g / π  (≥ 15 m)</text><text x="610.0" y="132.0" class="s">K_L1 = 4 ζ²</text><text x="610.0" y="156.0" class="s">φ_cmd = atan(a_cmd / g)</text><text x="610.0" y="180.0" class="s">T = 18 s, ζ = 0.75 → L₁ ≈ 73 m at 17 m/s</text></svg></div><figcaption>L1 guidance. The reference point R lies on the path at distance L₁ from the aircraft. Commanding a = K V_g² sin η / L₁ puts the aircraft on the circular arc (dotted) tangent to its velocity that passes through R. The law uses ground velocity, so it corrects for wind drift without a separate wind estimate.</figcaption></figure>
